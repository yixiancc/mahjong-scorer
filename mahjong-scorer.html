:root{--mj-text:#2b2219}

const EXCHANGES = ['none', 'cw', 'ccw', 'across'];
const DEFAULT_RULES = {base: 1, huaZhuPaysWinners: false, kongCountsAsRoot: true};

class RuleError extends Error {}
function rerr(msg) { throw new RuleError(msg); }
function fmtN(n) { return (n > 0 ? '+' : '') + n; }

function normalizeTraits(list, roots) {
  const t = new Set(list || []);
  for (const x of t) if (!TRAITS.includes(x)) rerr('未知的特征：' + x);
  if (t.has('将对')) t.add('对对胡');
  if (t.has('龙七对')) t.add('七对');
  if (t.has('七对') && roots >= 1) t.add('龙七对');
  if (t.has('天胡') && t.has('地胡')) rerr('天胡与地胡不能同时勾选');
  if (t.has('七对') && t.has('对对胡')) rerr('七对与对对胡（含将对）不能同时勾选');
  if (t.has('将对') && t.has('带幺九')) rerr('将对与带幺九不能同时勾选');
  if (t.has('龙七对') && roots < 1) rerr('龙七对至少要有 1 根');
  return t;
}

function baseFan(t) {
  const qing = t.has('清一色');
  const c = [];
  if (t.has('天胡')) c.push([6, '天胡']);
  if (t.has('地胡')) c.push([6, '地胡']);
  if (qing && t.has('龙七对')) c.push([6, '青龙七对']);
  if (qing && t.has('七对')) c.push([5, '清七对']);
  if (t.has('龙七对')) c.push([5, '龙七对']);
  if (qing && t.has('带幺九')) c.push([5, '清幺九']);
  if (qing && t.has('对对胡')) c.push([4, '清对']);
  if (t.has('将对')) c.push([4, '将对']);
  if (qing) c.push([3, '清一色']);
  if (t.has('带幺九')) c.push([3, '带幺九']);
  if (t.has('七对')) c.push([3, '七对']);
  if (t.has('对对胡')) c.push([2, '对对胡']);
  c.push([1, '平胡']);
  let best = c[0];
  for (const x of c) if (x[0] > best[0]) best = x;
  return best;
}

function validateWin(w) {
  if (!SEATS.includes(w.seat)) rerr('座位须为 1–4');
  if (!['zimo', 'dianpao', 'qiangang'].includes(w.mode)) rerr('胡牌方式不合法');
  if (w.mode === 'zimo') {
    if (w.source != null) rerr('自摸不需要指定对方座位');
  } else {
    if (!SEATS.includes(w.source)) rerr('点炮、抢杠需要指定对方座位');
    if (w.source === w.seat) rerr('对方座位不能是自己');
  }
  if (w.hua && w.mode !== 'zimo') rerr('杠上花只能与自摸同用');
  if (w.pao && w.mode !== 'dianpao') rerr('杠上炮只能与点炮同用');
  if (!Number.isInteger(w.roots) || w.roots < 0) rerr('根数须为不小于 0 的整数');
  if (w.mode !== 'zimo' && (w.traits || []).some(x => x === '天胡' || x === '地胡')) rerr('天胡、地胡只能自摸');
  normalizeTraits(w.traits, w.roots);
}

function computeFan(w, kongRoots, cfg) {
  const t = normalizeTraits(w.traits, w.roots);
  const [base, name] = baseFan(t);
  const dragon = t.has('龙七对') ? 1 : 0;
  const extra = cfg.kongCountsAsRoot ? kongRoots : 0;
  const root = Math.max(0, w.roots + extra - dragon);
  const hua = w.hua ? 1 : 0;
  const pao = w.pao ? 1 : 0;
  const total = base + hua + pao + root;
  const mult = 2 ** (total - 1);
  return {
    base, name, hua, pao, root, total, mult,
    amount: cfg.base * mult,
    describe() {
      const p = [name + base];
      if (hua) p.push('杠上花1');
      if (pao) p.push('杠上炮1');
      if (root) p.push('根' + root);
      return p.join(' + ') + ' = ' + total + '番';
    },
  };
}

function checkKong(k, won) {
  if (!SEATS.includes(k.seat)) rerr('座位须为 1–4');
  if (won.includes(k.seat)) rerr(k.seat + '号已经胡牌，不能再杠');
  if (!['ming', 'bu', 'an'].includes(k.kind)) rerr('杠的种类不合法');
  if (k.kind === 'ming') {
    if (!SEATS.includes(k.source)) rerr('明杠需要指定引杠者');
    if (k.source === k.seat) rerr('引杠者不能是自己');
    if (won.includes(k.source)) rerr(k.source + '号已经胡牌，不能被引杠');
  } else if (k.source != null) {
    rerr('只有明杠需要引杠者');
  }
}

function kongTransfers(k, won, cfg) {
  if (k.kind === 'ming') return [{payer: k.source, payee: k.seat, amount: cfg.base * 1, reason: '明杠'}];
  const mult = k.kind === 'bu' ? 1 : 2;
  const reason = k.kind === 'bu' ? '补杠' : '暗杠';
  return SEATS.filter(s => s !== k.seat && !won.includes(s))
    .map(s => ({payer: s, payee: k.seat, amount: cfg.base * mult, reason}));
}

function findKongBefore(i, w, events, kongs, mode) {
  let j = i - 1;
  while (j >= 0 && events[j].t === 'win' && events[j].mode === mode && events[j].source === w.source) j--;
  const k = kongs.get(j);
  if (mode === 'qiangang') {
    if (!k || k.kong.kind !== 'bu' || k.kong.seat !== w.source) rerr('抢杠胡：必须紧接在对方的补杠之后');
  } else {
    if (!k || k.kong.seat !== w.source || k.voided) rerr('杠上炮：点炮者必须刚刚杠过，且杠后打出的这张牌即为胡牌');
  }
  return k;
}

function settleWin(i, w, events, won, kongs, items, cfg) {
  validateWin(w);
  if (won.includes(w.seat)) rerr(w.seat + '号已经胡牌，不能再胡');
  if (w.mode !== 'zimo' && won.includes(w.source)) rerr(w.source + '号已经胡牌，不能点炮或被抢杠');
  if (w.hua) {
    const k = kongs.get(i - 1);
    if (!k || k.kong.seat !== w.seat) rerr('杠上花：胡者必须刚刚杠过，且杠后直接自摸');
  }
  let zhuanyi = 0;
  if (w.mode === 'qiangang') findKongBefore(i, w, events, kongs, 'qiangang').voided = true;
  if (w.mode === 'dianpao' && w.pao) {
    const k = findKongBefore(i, w, events, kongs, 'dianpao');
    zhuanyi = k.transfers.reduce((a, t) => a + t.amount, 0);
  }
  let kr = 0;
  for (const rec of kongs.values()) if (rec.kong.seat === w.seat && !rec.voided) kr++;
  const fan = computeFan(w, kr, cfg);
  const amt = fan.amount;
  if (w.mode === 'zimo') {
    for (const s of SEATS) if (s !== w.seat && !won.includes(s)) items.push({payer: s, payee: w.seat, amount: amt, reason: '自摸'});
  } else {
    items.push({payer: w.source, payee: w.seat, amount: amt, reason: w.mode === 'dianpao' ? '点炮' : '抢杠'});
    if (zhuanyi) items.push({payer: w.source, payee: w.seat, amount: zhuanyi, reason: '杠上炮转移'});
  }
  return {index: i, win: w, fan, amount: amt, zhuanyi};
}

// 流局听牌：由特征与根数算最大番（流局没有胡牌动作，不含杠上花、杠上炮）
function tingList(d) {
  return (d.ting || []).map(x => Array.isArray(x)
    ? {seat: x[0], legacy: x[1]}   // 旧存档格式：[座位, 最大番]
    : {seat: x.seat, traits: x.traits || [], roots: x.roots || 0});
}
function kongRootsOf(kongs, seat) {
  let n = 0;
  for (const rec of kongs.values()) if (rec.kong.seat === seat && !rec.voided) n++;
  return n;
}
function tingFan(e, kongRoots, cfg) {
  if (!SEATS.includes(e.seat)) rerr('听牌座位须为 1–4');
  if (!Number.isInteger(e.roots) || e.roots < 0) rerr('根数须为不小于 0 的整数');
  if (e.traits.includes('天胡') || e.traits.includes('地胡')) rerr('流局听牌不能选天胡或地胡');
  const t = normalizeTraits(e.traits, e.roots);
  const [base, name] = baseFan(t);
  const dragon = t.has('龙七对') ? 1 : 0;
  const root = Math.max(0, e.roots + (cfg.kongCountsAsRoot ? kongRoots : 0) - dragon);
  const total = base + root;
  return {total, desc: name + base + (root ? ' + 根' + root : '') + ' = ' + total + '番'};
}

function settleDraw(d, won, kongs, cfg) {
  const unwon = SEATS.filter(s => !won.includes(s));
  if (unwon.length < 2) rerr('未胡的玩家不足 2 人，不能流局');
  const hp = new Set(d.huapig || []);
  if (hp.size !== (d.huapig || []).length) rerr('同一座位不能重复列为花猪');
  const ting = new Map();
  for (const e of tingList(d)) {
    if (ting.has(e.seat)) rerr(e.seat + '号重复列为听牌');
    let f;
    if ('legacy' in e) {
      if (!Number.isInteger(e.legacy) || e.legacy < 1) rerr('听牌的最大番须为不小于 1 的整数');
      f = {total: e.legacy, desc: e.legacy + '番'};
    } else {
      f = tingFan(e, kongRootsOf(kongs, e.seat), cfg);
    }
    ting.set(e.seat, f);
  }
  for (const s of hp) if (!unwon.includes(s)) rerr(s + '号已经胡牌，不能是花猪');
  for (const s of ting.keys()) {
    if (!unwon.includes(s)) rerr(s + '号已经胡牌，不能听牌');
    if (hp.has(s)) rerr(s + '号不能同时是花猪和听牌');
  }
  const out = [];
  for (const h of [...hp].sort()) {
    for (const s of SEATS) {
      if (s === h || hp.has(s)) continue;
      if (won.includes(s) && !cfg.huaZhuPaysWinners) continue;
      out.push({payer: h, payee: s, amount: cfg.base * 16, reason: '花猪'});
    }
  }
  const dajiao = unwon.filter(s => !hp.has(s) && !ting.has(s));
  for (const dd of dajiao) {
    for (const t of [...ting.keys()].sort()) {
      out.push({payer: dd, payee: t, amount: cfg.base * 2 ** (ting.get(t).total - 1), reason: '查大叫'});
    }
  }
  for (const dd of dajiao) {
    for (const rec of kongs.values()) {
      if (rec.voided) continue;
      for (const tr of rec.transfers) if (tr.payee === dd) out.push({payer: dd, payee: tr.payer, amount: tr.amount, reason: '退杠'});
    }
  }
  return {out, tingFan: Object.fromEntries(ting)};
}

// 本局结算。cfg 需含 base / huaZhuPaysWinners / kongCountsAsRoot
function settle(events, cfg) {
  const won = [], items = [], kongs = new Map(), wins = [];
  let draw = null, ended = false;
  events.forEach((ev, i) => {
    if (ended) rerr('本局已结束，请先开始下一局');
    if (ev.t === 'kong') {
      checkKong(ev, won);
      const rec = {rec: true, index: i, kong: ev, transfers: kongTransfers(ev, won, cfg), voided: false};
      kongs.set(i, rec);
      items.push(rec);
    } else if (ev.t === 'win') {
      const wr = settleWin(i, ev, events, won, kongs, items, cfg);
      wins.push(wr);
      won.push(ev.seat);
      if (won.length >= 3) ended = true;
    } else if (ev.t === 'draw') {
      draw = ev;
      ended = true;
    } else {
      rerr('无法识别的记录');
    }
  });
  let tingOut = {};
  if (draw) {
    const sd = settleDraw(draw, won, kongs, cfg);
    items.push(...sd.out);
    tingOut = sd.tingFan;
  }
  const transfers = [], voided = [];
  for (const it of items) {
    if (it.rec) {
      if (it.voided) voided.push(it.index);
      else transfers.push(...it.transfers);
    } else {
      transfers.push(it);
    }
  }
  const net = {1: 0, 2: 0, 3: 0, 4: 0};
  for (const t of transfers) { net[t.payee] += t.amount; net[t.payer] -= t.amount; }
  if (SEATS.reduce((a, s) => a + net[s], 0) !== 0) throw new Error('内部错误：净收支不平衡');
  const kongRoots = Object.fromEntries(SEATS.map(s => [s, kongRootsOf(kongs, s)]));
  return {ended, wins, draw, transfers, net, voided, won, tingFan: tingOut, kongRoots};
}

function newHand(rules, dealer, exchange) {
  return {base: rules.base, huaZhuPaysWinners: rules.huaZhuPaysWinners, kongCountsAsRoot: rules.kongCountsAsRoot, dealer, exchange, events: []};
}
function newState() {
  const rules = Object.assign({}, DEFAULT_RULES);
  return {v: 1, names: {1: '东', 2: '南', 3: '西', 4: '北'}, rules, dealerMode: true, hands: [newHand(rules, 1, 'none')]};
}
function curHand(state) { return state.hands[state.hands.length - 1]; }
function handResult(h) { return settle(h.events, h); }

function addEvent(state, ev) {
  const h = curHand(state);
  const next = h.events.concat([ev]);
  const r = settle(next, h);
  h.events = next;
  return r;
}
function removeEvent(state, idx) {
  const h = curHand(state);
  const cand = h.events.filter((_, k) => k !== idx);
  try { settle(cand, h); } catch (e) {
    if (e instanceof RuleError) rerr('删除后会导致后续记录不合法，请先撤销后面的记录');
    throw e;
  }
  h.events = cand;
}
function undoLast(state) {
  const h = curHand(state);
  if (h.events.length) { h.events.pop(); return '已撤销上一步'; }
  if (state.hands.length > 1) { state.hands.pop(); return '已撤销「下一局」'; }
  rerr('没有可以撤销的记录');
}
function nextHand(state) {
  const h = curHand(state);
  if (!handResult(h).ended) rerr('本局尚未结束，不能开始下一局');
  state.hands.push(newHand(state.rules, h.dealer % 4 + 1, 'none'));
}
// 改基本分/开关：立即作用于当前未结束的局和之后的局；已结束的局保留原值
function setRule(state, key, val) {
  state.rules[key] = val;
  const h = curHand(state);
  if (!handResult(h).ended) h[key] = val;
}
function totals(state) {
  const t = {1: 0, 2: 0, 3: 0, 4: 0};
  for (const h of state.hands) {
    const r = settle(h.events, h);
    for (const s of SEATS) t[s] += r.net[s];
  }
  return t;
}
function summaryText(state) {
  const t = totals(state);
  const lines = ['血战到底 · 基本分 ' + state.rules.base];
  state.hands.forEach((h, i) => {
    if (!h.events.length) return;
    const r = settle(h.events, h);
    lines.push('第' + (i + 1) + '局：' + SEATS.map(s => state.names[s] + ' ' + fmtN(r.net[s])).join('  '));
  });
  lines.push('累计：' + SEATS.map(s => state.names[s] + ' ' + fmtN(t[s])).join('  '));
  return lines.join('\n');
}
function validateState(o) {
  if (!o || o.v !== 1 || !Array.isArray(o.hands) || !o.hands.length) rerr('文件格式不正确');
  const d = newState();
  o.names = Object.assign(d.names, o.names || {});
  o.rules = Object.assign({}, DEFAULT_RULES, o.rules || {});
  o.dealerMode = o.dealerMode !== false;
  if (!Number.isInteger(o.rules.base) || o.rules.base < 1) rerr('基本分须为不小于 1 的整数');
  o.hands.forEach((h, i) => {
    if (!Array.isArray(h.events)) rerr('第 ' + (i + 1) + ' 局格式不正确');
    if (h.base == null) h.base = o.rules.base;
    if (h.huaZhuPaysWinners == null) h.huaZhuPaysWinners = o.rules.huaZhuPaysWinners;
    if (h.kongCountsAsRoot == null) h.kongCountsAsRoot = o.rules.kongCountsAsRoot;
    if (!SEATS.includes(h.dealer)) h.dealer = 1;
    if (!EXCHANGES.includes(h.exchange)) h.exchange = 'none';
    const r = settle(h.events, h);
    if (i < o.hands.length - 1 && !r.ended) rerr('第 ' + (i + 1) + ' 局尚未结束');
  });
  return o;
}
/*@core-end*/

// ===== 界面 =====
const KEY = 'mahjong-scorer-html-v1';
const EXCH_TEXT = {none: '不换', cw: '顺时针 ↻', ccw: '逆时针 ↺', across: '对家 ⇄'};
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const cls = n => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
const nm = s => esc(S.names[s]);
let S = loadState();
let seatDraft = null;
let drawDraft = null;
let toastTimer = 0;

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return newState(); }
  if (!raw) return newState();
  try {
    return validateState(JSON.parse(raw));
  } catch (e) {
    try { localStorage.setItem(KEY + '-broken-' + Date.now(), raw); } catch (_) {}
    setTimeout(() => toast('原存档无法读取，已备份，现开始新记录', true), 400);
    return newState();
  }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存失败：' + e.message, true); }
  render();
}
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = (isErr ? 'err ' : '') + 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

function render() {
  const h = curHand(S);
  let r = null, err = null, tot = {1: 0, 2: 0, 3: 0, 4: 0};
  try { r = handResult(h); } catch (e) { err = e.message; }
  try { tot = totals(S); } catch (e) { err = err || e.message; }
  $('#basePill').textContent = '基本分 ' + S.rules.base;
  renderHandBar(h);
  renderTable(h, r, tot);
  renderActions(r);
  renderSettlement(r, err);
  renderRecords(h, r);
  renderTotals(tot);
}

function renderHandBar(h) {
  const dealerPart = S.dealerMode
    ? '<label>庄 <select data-change="dealer">' +
      SEATS.map(s => `<option value="${s}"${h.dealer === s ? ' selected' : ''}>${DIR[s]} ${nm(s)}</option>`).join('') +
      '</select></label>'
    : '';
  $('#handbar').innerHTML =
    '<strong>第 ' + S.hands.length + ' 局</strong>' + dealerPart +
    '<button class="outline roll" data-act="roll" title="随机抽一个换三张方向（只作记录，不影响计分）">换三张：' +
      (h.exchange === 'none' ? '点击随机' : EXCH_TEXT[h.exchange]) + '</button>';
}

function drawTag(s, r) {
  if (r.draw.huapig.includes(s)) return '花猪';
  const f = r.tingFan[s];
  return f ? '听牌 ' + f.total + '番' : '大叫';
}

function renderTable(h, r, tot) {
  const seat = s => {
    const w = r && r.wins.find(x => x.win.seat === s);
    const status = w ? '已胡 · ' + w.fan.total + '番' : (r && r.draw ? drawTag(s, r) : '未胡');
    const net = r ? r.net[s] : 0;
    return `<button class="seat${w ? ' won' : ''}" data-act="seat" data-seat="${s}">
      <span class="avatar a${s}">${DIR[s]}</span>
      ${S.dealerMode && h.dealer === s ? '<span class="dealer">庄</span>' : ''}
      <span class="pname">${nm(s)}</span>
      <span class="status">${esc(status)}</span>
      <span class="net ${cls(net)}">本局 ${fmtN(net)}</span>
      <span class="sub">累计 ${fmtN(tot[s])}</span>
    </button>`;
  };
  const ended = r && r.ended;
  const won = r ? r.won.length : 0;
  $('#table').innerHTML = `<div class="compass">
    <div class="cell-n">${seat(4)}</div>
    <div class="cell-w">${seat(3)}</div>
    <div class="cell-c center"><div class="cnum">第 ${S.hands.length} 局</div><div>基本分 ${h.base}</div><div>${ended ? '本局已结束' : '已胡 ' + won + ' 家'}</div></div>
    <div class="cell-e">${seat(1)}</div>
    <div class="cell-s">${seat(2)}</div>
  </div>`;
}

function renderActions(r) {
  $('#actions').innerHTML = r && r.ended
    ? '<button class="w100" data-act="next">开始第 ' + (S.hands.length + 1) + ' 局 →</button>'
    : '<button class="secondary w100" data-act="draw">本局流局（牌摸完）</button>';
}

function renderSettlement(r, err) {
  const box = $('#settlement');
  if (err) { box.innerHTML = `<article class="card warn">本局数据异常：${esc(err)}</article>`; return; }
  if (!r || !r.ended) { box.innerHTML = ''; return; }
  const rows = r.transfers.map(t =>
    `<li class="rec"><span>${nm(t.payer)} → ${nm(t.payee)} <span class="muted">${t.reason}</span></span><b>${t.amount}</b></li>`).join('');
  box.innerHTML = `<article class="card">
    <h3>第 ${S.hands.length} 局结算</h3>
    <ul class="plain">${rows || '<li class="muted">无收付</li>'}</ul>
    <div class="netrow">${SEATS.map(s => `<span class="${cls(r.net[s])}">${nm(s)} ${fmtN(r.net[s])}</span>`).join('')}</div>
    ${r.voided.length ? '<p class="muted">有补杠被抢杠作废，已不计杠分。</p>' : ''}
  </article>`;
}

function describeEvent(ev, i, r) {
  if (ev.t === 'kong') {
    return nm(ev.seat) + ' ' + KONG_TEXT[ev.kind] + (ev.kind === 'ming' ? ' ← ' + nm(ev.source) : '');
  }
  if (ev.t === 'win') {
    const w = r && r.wins.find(x => x.index === i);
    const who = ev.mode === 'zimo' ? '自摸' : MODE_TEXT[ev.mode] + ' ← ' + nm(ev.source);
    return nm(ev.seat) + ' 胡 · ' + who + (w ? ' · ' + esc(w.fan.describe()) + ' · 每次 ' + w.amount : '');
  }
  if (ev.t === 'draw') {
    const hz = ev.huapig.map(nm).join('、');
    const tf = (r && r.tingFan) || {};
    const tg = Object.keys(tf).map(s => nm(+s) + '（' + esc(tf[s].desc) + '）').join('、');
    return '流局' + (hz ? ' · 花猪：' + hz : '') + (tg ? ' · 听牌：' + tg : '');
  }
  return '?';
}

function renderRecords(h, r) {
  const items = h.events.map((ev, i) =>
    `<li class="rec"><span>${describeEvent(ev, i, r)}</span><button class="outline sm" data-act="del" data-idx="${i}">删除</button></li>`).join('');
  $('#records').innerHTML = items
    ? `<ul class="plain">${items}</ul>`
    : '<p class="muted">本局还没有记录。点上面的座位开始记账。</p>';
}

function renderTotals(tot) {
  const rows = [];
  S.hands.forEach((h, idx) => {
    if (!h.events.length && idx === S.hands.length - 1) return;
    const r = handResult(h);
    rows.push(`<tr><th>${idx + 1}</th>${SEATS.map(s => `<td class="${cls(r.net[s])}">${fmtN(r.net[s])}</td>`).join('')}</tr>`);
  });
  $('#totals').innerHTML = `<div class="scroll"><table class="totals">
    <thead><tr><th>局</th>${SEATS.map(s => `<th>${nm(s)}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('') || '<tr><td colspan="5" class="muted">暂无已记录的局</td></tr>'}</tbody>
    <tfoot><tr><th>累计</th>${SEATS.map(s => `<td class="${cls(tot[s])}"><b>${fmtN(tot[s])}</b></td>`).join('')}</tr></tfoot>
  </table></div>`;
}

// ----- 座位对话框 -----
function chip(act, attr, val, pressed, label) {
  return `<button class="chip" data-act="${act}" ${attr}="${val}" aria-pressed="${pressed}">${esc(label)}</button>`;
}
function winEventFrom(d) {
  return {
    t: 'win', seat: d.seat, mode: d.mode,
    source: d.mode === 'zimo' ? null : d.source,
    traits: [...d.traits], roots: d.roots,
    hua: d.mode === 'zimo' && d.hua,
    pao: d.mode === 'dianpao' && d.pao,
  };
}
function previewWin(d) {
  try {
    const h = curHand(S);
    const r = settle(h.events.concat([winEventFrom(d)]), h);
    const w = r.wins[r.wins.length - 1];
    const pay = d.mode === 'zimo' ? '每家付' : '付给胡家';
    return {ok: true, html: esc(w.fan.describe()) + ' · ' + w.fan.mult + '倍 · ' + pay + ' ' + w.amount +
      (w.zhuanyi ? '（另转移杠分 ' + w.zhuanyi + '）' : '')};
  } catch (e) {
    return {ok: false, html: esc(e.message)};
  }
}
// 根据记录顺序给出杠上花/杠上炮的默认勾选，用户可改
function applySuggest(d) {
  const ev = curHand(S).events;
  const last = ev[ev.length - 1];
  d.hua = d.mode === 'zimo' && !!last && last.t === 'kong' && last.seat === d.seat;
  let j = ev.length - 1;
  while (j >= 0 && d.source != null && ev[j].t === 'win' && ev[j].mode === 'dianpao' && ev[j].source === d.source) j--;
  d.pao = d.mode === 'dianpao' && d.source != null && j >= 0 && ev[j].t === 'kong' && ev[j].seat === d.source;
}

function openSeat(seat) {
  const r = handResult(curHand(S));
  if (r.ended) { toast('本局已结束，请先点「开始下一局」', true); return; }
  seatDraft = {seat, won: r.won.includes(seat), mode: null, source: null, traits: [], roots: 0, hua: false, pao: false, kong: null};
  renderSeat();
  $('#seatDlg').showModal();
}

function renderSeat() {
  const d = seatDraft;
  const others = SEATS.filter(s => s !== d.seat);
  const head = `<header class="dlg-head"><strong>${nm(d.seat)}（${DIR[d.seat]}）</strong><button class="outline sm" data-act="close-seat">关闭</button></header>`;
  if (d.won) {
    const w = handResult(curHand(S)).wins.find(x => x.win.seat === d.seat);
    $('#seatBody').innerHTML = head +
      `<p>本局已胡：${esc(w.fan.describe())}，${MODE_TEXT[w.win.mode]}${w.win.source != null ? '（' + nm(w.win.source) + '）' : ''}，每次 ${w.amount}。</p>
       <p class="muted">要修改，请在「本局记录」里删除这条胡牌。</p>`;
    return;
  }
  const modeBtns = ['zimo', 'dianpao', 'qiangang'].map(m =>
    `<button data-act="win-mode" data-mode="${m}" aria-pressed="${d.mode === m}" class="${d.mode === m ? '' : 'outline'}">${MODE_TEXT[m]}</button>`).join('');
  let winPart = '';
  if (d.mode) {
    const srcLabel = d.mode === 'qiangang' ? '补杠者（被抢杠的人）' : '点炮者（打出这张牌的人）';
    const srcPart = d.mode !== 'zimo'
      ? `<p class="label">${srcLabel}</p><div class="chips">${others.map(s => chip('win-source', 'data-seat', s, d.source === s, DIR[s] + ' · ' + S.names[s])).join('')}</div>`
      : '';
    const traitChips = TRAITS.map(t => {
      const dis = (t === '天胡' || t === '地胡') && d.mode !== 'zimo';
      return `<button class="chip" data-act="trait" data-trait="${t}" aria-pressed="${d.traits.includes(t)}" ${dis ? 'disabled' : ''}>${t}</button>`;
    }).join('');
    const pv = previewWin(d);
    winPart = `${srcPart}
      <p class="label">特征（可多选，平胡不用选）</p><div class="chips">${traitChips}</div>
      <div class="row"><span>根数</span><div class="stepper">
        <button class="outline sm" data-act="root" data-d="-1">−</button><output>${d.roots}</output><button class="outline sm" data-act="root" data-d="1">+</button>
      </div></div>
      <div>
        <label class="chk${d.mode === 'zimo' ? '' : ' dis'}"><input type="checkbox" data-change="flag" data-flag="hua" ${d.hua ? 'checked' : ''} ${d.mode === 'zimo' ? '' : 'disabled'}> 杠上花</label>
        <label class="chk${d.mode === 'dianpao' ? '' : ' dis'}"><input type="checkbox" data-change="flag" data-flag="pao" ${d.pao ? 'checked' : ''} ${d.mode === 'dianpao' ? '' : 'disabled'}> 杠上炮</label>
      </div>
      <div class="preview${pv.ok ? '' : ' err'}">${pv.ok ? pv.html : pv.html}</div>
      <button class="w100" data-act="win-submit" ${pv.ok ? '' : 'disabled'}>确认胡牌</button>`;
  } else {
    winPart = '<p class="muted">先选胡牌方式。</p>';
  }
  const kongPart = `<h4>杠</h4>
    <div class="grid3">${['ming', 'bu', 'an'].map(k =>
      `<button class="${d.kong === k ? '' : 'outline'}" data-act="kong" data-kind="${k}">${KONG_TEXT[k]}</button>`).join('')}</div>
    ${d.kong === 'ming'
      ? `<p class="label">引杠者（打出这张牌的人）</p><div class="chips">${others.map(s => chip('kong-source', 'data-seat', s, false, DIR[s] + ' · ' + S.names[s])).join('')}</div>`
      : '<p class="muted">明杠需再选引杠者；补杠、暗杠点击即记录。</p>'}`;
  $('#seatBody').innerHTML = head + '<h4>胡牌</h4><div role="group">' + modeBtns + '</div>' + winPart + kongPart;
}

function submitWin() {
  const ev = winEventFrom(seatDraft);
  const r = addEvent(S, ev);
  const w = r.wins[r.wins.length - 1];
  $('#seatDlg').close();
  seatDraft = null;
  persist();
  toast(DIR[ev.seat] + '胡：' + w.fan.describe() + '，每次 ' + w.amount);
}
function submitKong(seat, kind, source) {
  addEvent(S, {t: 'kong', seat, kind, source});
  $('#seatDlg').close();
  seatDraft = null;
  persist();
  toast(DIR[seat] + KONG_TEXT[kind] + '已记录');
}

// ----- 流局对话框 -----
function openDraw() {
  const r = handResult(curHand(S));
  if (r.ended) { toast('本局已结束', true); return; }
  drawDraft = {hz: new Set(), ting: new Map()};
  renderDraw();
  $('#drawDlg').showModal();
}
function renderDraw() {
  const h = curHand(S);
  const r = handResult(h);
  const unwon = SEATS.filter(s => !r.won.includes(s));
  let errors = 0;
  const rows = unwon.map(s => {
    const hz = drawDraft.hz.has(s);
    const v = drawDraft.ting.get(s);
    let body = '';
    if (v) {
      const chips = TRAITS.map(t => {
        const dis = t === '天胡' || t === '地胡';
        return `<button class="chip" data-act="dtrait" data-seat="${s}" data-trait="${t}" aria-pressed="${v.traits.includes(t)}"${dis ? ' disabled' : ''}>${t}</button>`;
      }).join('');
      let pv;
      try {
        const f = tingFan({seat: s, traits: v.traits, roots: v.roots}, r.kongRoots[s], h);
        pv = `<div class="preview">最大番：${esc(f.desc)}；每个大叫付 ${h.base * 2 ** (f.total - 1)}</div>`;
      } catch (e) {
        errors++;
        pv = `<div class="preview err">${esc(e.message)}</div>`;
      }
      body = `<p class="label">听牌的特征（可多选，程序自动算番）</p><div class="chips">${chips}</div>
        <div class="row"><span>根数</span><div class="stepper">
          <button class="outline sm" data-act="droot" data-seat="${s}" data-d="-1">−</button><output>${v.roots}</output><button class="outline sm" data-act="droot" data-seat="${s}" data-d="1">+</button>
        </div></div>${pv}`;
    }
    return `<div class="drow"><strong>${nm(s)}</strong>
      <div class="chips">
        <button class="chip" data-act="dhz" data-seat="${s}" aria-pressed="${hz}">花猪</button>
        <button class="chip" data-act="dting" data-seat="${s}" aria-pressed="${!!v}">听牌</button>
      </div>${body}</div>`;
  }).join('');
  $('#drawBody').innerHTML = `<header class="dlg-head"><strong>流局（牌摸完）</strong><button class="outline sm" data-act="close-draw">关闭</button></header>
    <p class="muted">只列出未胡的玩家。标记花猪（手里三门都有牌）；或标记听牌，选特征和根数，程序自动算最大番。未标记者视为大叫。</p>
    ${rows}
    <div class="foot"><button class="outline" data-act="close-draw">取消</button><button data-act="draw-submit"${errors ? ' disabled' : ''}>确认流局</button></div>`;
}

// ----- 设置对话框 -----
function openSettings() { renderSettings(); $('#setDlg').showModal(); }
function renderSettings() {
  const R = S.rules;
  $('#setBody').innerHTML = `<header class="dlg-head"><strong>设置</strong><button class="outline sm" data-act="close-settings">关闭</button></header>
    <div class="dlg-scroll">
    <h4>方向名字</h4>
    <div class="grid2">${SEATS.map(s =>
      `<label>${DIR[s]}位<input data-change="name" data-seat="${s}" value="${esc(S.names[s])}" maxlength="8"></label>`).join('')}</div>
    <h4>基本分</h4>
    <label>基本分<input type="number" min="1" step="1" value="${R.base}" data-change="base"></label>
    <p class="muted">改动立即生效：当前未结束的局和之后的局使用新基本分；已结束的局保留原来的基本分。</p>
    <h4>庄家</h4>
    <label class="chk"><input type="checkbox" data-change="dealerMode" ${S.dealerMode ? 'checked' : ''}> 是否设置庄家</label>
    <p class="muted">不勾选时不显示庄家，计分不受影响。勾选后，本局栏出现「庄」选择。</p>
    <h4>规则开关</h4>
    <label class="chk"><input type="checkbox" data-change="rule" data-key="huaZhuPaysWinners" ${R.huaZhuPaysWinners ? 'checked' : ''}> 花猪也赔给已胡的玩家</label>
    <label class="chk"><input type="checkbox" data-change="rule" data-key="kongCountsAsRoot" ${R.kongCountsAsRoot ? 'checked' : ''}> 杠算一根（每个有效杠另加 1 番）</label>
    <p class="muted">开关只影响当前未结束的局和之后的局。</p>
    <h4>数据</h4>
    <div class="grid2"><button class="outline" data-act="export">导出 JSON</button><input type="file" accept=".json,application/json" data-change="import" aria-label="导入 JSON"></div>
    <p></p>
    <button class="contrast w100" data-act="reset">清空所有局（保留名字和设置）</button>
    </div>
    <div class="foot"><button data-act="close-settings">完成</button></div>`;
}
function exportJson() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mahjong-scorer-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      S = validateState(JSON.parse(reader.result));
      persist();
      renderSettings();
      toast('已导入');
    } catch (e) {
      toast('导入失败：' + e.message, true);
    }
  };
  reader.readAsText(file);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制，可粘贴到微信');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? '已复制，可粘贴到微信' : '复制失败，请手动选择文本', !ok);
  }
}

// ----- 事件分派 -----
function act(a, el) {
  const d = el.dataset;
  switch (a) {
    case 'seat': openSeat(+d.seat); break;
    case 'close-seat': $('#seatDlg').close(); seatDraft = null; break;
    case 'win-mode':
      seatDraft.mode = d.mode;
      if (d.mode === 'zimo') seatDraft.source = null;
      if (d.mode !== 'zimo') seatDraft.traits = seatDraft.traits.filter(t => t !== '天胡' && t !== '地胡');
      applySuggest(seatDraft);
      renderSeat();
      break;
    case 'win-source':
      seatDraft.source = +d.seat;
      applySuggest(seatDraft);
      renderSeat();
      break;
    case 'trait': {
      const t = d.trait;
      seatDraft.traits = seatDraft.traits.includes(t) ? seatDraft.traits.filter(x => x !== t) : seatDraft.traits.concat([t]);
      renderSeat();
      break;
    }
    case 'root':
      seatDraft.roots = Math.min(20, Math.max(0, seatDraft.roots + +d.d));
      renderSeat();
      break;
    case 'win-submit': submitWin(); break;
    case 'kong':
      if (d.kind === 'ming') { seatDraft.kong = 'ming'; renderSeat(); }
      else submitKong(seatDraft.seat, d.kind, null);
      break;
    case 'kong-source': submitKong(seatDraft.seat, 'ming', +d.seat); break;
    case 'draw': openDraw(); break;
    case 'close-draw': $('#drawDlg').close(); drawDraft = null; break;
    case 'dhz': {
      const s = +d.seat;
      if (drawDraft.hz.has(s)) drawDraft.hz.delete(s);
      else { drawDraft.hz.add(s); drawDraft.ting.delete(s); }
      renderDraw();
      break;
    }
    case 'dting': {
      const s = +d.seat;
      if (drawDraft.ting.has(s)) drawDraft.ting.delete(s);
      else { drawDraft.ting.set(s, {traits: [], roots: 0}); drawDraft.hz.delete(s); }
      renderDraw();
      break;
    }
    case 'dtrait': {
      const v = drawDraft.ting.get(+d.seat);
      if (v) v.traits = v.traits.includes(d.trait) ? v.traits.filter(x => x !== d.trait) : v.traits.concat([d.trait]);
      renderDraw();
      break;
    }
    case 'droot': {
      const v = drawDraft.ting.get(+d.seat);
      if (v) v.roots = Math.min(20, Math.max(0, v.roots + +d.d));
      renderDraw();
      break;
    }
    case 'draw-submit':
      addEvent(S, {
        t: 'draw',
        huapig: [...drawDraft.hz],
        ting: [...drawDraft.ting.entries()].map(([s, v]) => ({seat: s, traits: [...v.traits], roots: v.roots})),
      });
      $('#drawDlg').close();
      drawDraft = null;
      persist();
      toast('已记录流局');
      break;
    case 'next':
      nextHand(S);
      persist();
      toast('开始第 ' + S.hands.length + ' 局');
      break;
    case 'undo': {
      const msg = undoLast(S);
      persist();
      toast(msg);
      break;
    }
    case 'del':
      removeEvent(S, +d.idx);
      persist();
      toast('已删除这条记录');
      break;
    case 'roll': {
      const pool = ['cw', 'ccw', 'across'];
      curHand(S).exchange = pool[Math.floor(Math.random() * pool.length)];
      persist();
      toast('换三张方向：' + EXCH_TEXT[curHand(S).exchange]);
      break;
    }
    case 'copy': copyText(summaryText(S)); break;
    case 'settings': openSettings(); break;
    case 'close-settings': $('#setDlg').close(); break;
    case 'export': exportJson(); break;
    case 'reset':
      if (confirm('清空所有局的记录？方向名字和设置会保留。')) {
        S.hands = [newHand(S.rules, 1, 'none')];
        persist();
        renderSettings();
        toast('已清空记录');
      }
      break;
  }
}

function change(a, el) {
  const d = el.dataset;
  switch (a) {
    case 'dealer': curHand(S).dealer = +el.value; persist(); break;
    case 'name':
      S.names[+d.seat] = el.value.trim() || DIR[+d.seat];
      persist();
      break;
    case 'base': {
      const v = Math.floor(Number(el.value));
      if (!(v >= 1)) rerr('基本分须为不小于 1 的整数');
      setRule(S, 'base', v);
      persist();
      toast('基本分已设为 ' + v);
      break;
    }
    case 'dealerMode':
      S.dealerMode = el.checked;
      persist();
      break;
    case 'rule':
      setRule(S, d.key, el.checked);
      persist();
      break;
    case 'flag':
      seatDraft[d.flag] = el.checked;
      renderSeat();
      break;
    case 'import': {
      const f = el.files && el.files[0];
      if (f) importFile(f);
      el.value = '';
      break;
    }
  }
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  try { act(el.dataset.act, el); } catch (e) { toast(e.message || String(e), true); }
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (!el) return;
  try { change(el.dataset.change, el); } catch (e) { toast(e.message || String(e), true); }
});

render();
</script>
</body>
</html>
